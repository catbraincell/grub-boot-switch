#
# A realistic Debian/Ubuntu grub.cfg, trimmed to the parts the app parses.
# Nothing here is installed or booted -- it is input for:
#
#     sudo grub-boot-switch-manager tests/fixtures/debian.cfg
#
### BEGIN /etc/grub.d/00_header ###
if [ x"${feature_menuentry_id}" = xy ]; then
  menuentry_id_option="--id"
else
  menuentry_id_option=""
fi
### END /etc/grub.d/00_header ###

### BEGIN /etc/grub.d/10_linux ###
menuentry 'Debian GNU/Linux' --class debian --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-simple-6f1b0f6b-1111-2222-3333-444455556666' {
	load_video
	insmod gzio
	insmod part_gpt
	insmod ext2
	search --no-floppy --fs-uuid --set=root 6f1b0f6b-1111-2222-3333-444455556666
	linux	/boot/vmlinuz-6.1.0-18-amd64 root=UUID=6f1b0f6b-1111-2222-3333-444455556666 ro quiet
	initrd	/boot/initrd.img-6.1.0-18-amd64
}
submenu 'Advanced options for Debian GNU/Linux' $menuentry_id_option 'gnulinux-advanced-6f1b0f6b-1111-2222-3333-444455556666' {
	menuentry 'Debian GNU/Linux, with Linux 6.1.0-18-amd64' --class debian $menuentry_id_option 'gnulinux-6.1.0-18-amd64-advanced-6f1b0f6b-1111-2222-3333-444455556666' {
		search --no-floppy --fs-uuid --set=root 6f1b0f6b-1111-2222-3333-444455556666
		linux	/boot/vmlinuz-6.1.0-18-amd64 root=UUID=6f1b0f6b-1111-2222-3333-444455556666 ro quiet
		initrd	/boot/initrd.img-6.1.0-18-amd64
	}
	menuentry 'Debian GNU/Linux, with Linux 6.1.0-18-amd64 (recovery mode)' --class debian $menuentry_id_option 'gnulinux-6.1.0-18-amd64-recovery-6f1b0f6b-1111-2222-3333-444455556666' {
		search --no-floppy --fs-uuid --set=root 6f1b0f6b-1111-2222-3333-444455556666
		linux	/boot/vmlinuz-6.1.0-18-amd64 root=UUID=6f1b0f6b-1111-2222-3333-444455556666 ro single
	}
}
### END /etc/grub.d/10_linux ###

### BEGIN /etc/grub.d/30_os-prober ###
menuentry 'Windows Boot Manager (on /dev/nvme0n1p1)' --class windows --class os $menuentry_id_option 'osprober-efi-1234-ABCD' {
	insmod part_gpt
	insmod fat
	search --no-floppy --fs-uuid --set=root 1234-ABCD
	chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}
menuentry 'Fedora Linux 39 (Workstation Edition) (on /dev/nvme0n1p5)' --class fedora --class gnu-linux --class gnu --class os $menuentry_id_option 'osprober-gnulinux-simple-aaaabbbb-cccc-dddd-eeee-ffff00001111' {
	insmod ext2
	search --no-floppy --fs-uuid --set=root aaaabbbb-cccc-dddd-eeee-ffff00001111
	linux /boot/vmlinuz-6.8.5 root=UUID=aaaabbbb-cccc-dddd-eeee-ffff00001111 ro
	initrd /boot/initramfs-6.8.5.img
}
### END /etc/grub.d/30_os-prober ###

### BEGIN /etc/grub.d/30_uefi-firmware ###
menuentry 'UEFI Firmware Settings' $menuentry_id_option 'uefi-firmware' {
	fwsetup
}
### END /etc/grub.d/30_uefi-firmware ###
